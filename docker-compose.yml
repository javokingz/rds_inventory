version: '3.8'

services:
  rds-dashboard:
    build: .
    container_name: rds-dashboard
    ports:
      - "8000:8000"
    volumes:
      # Montar configuración de AWS desde el host
      - ~/.aws:/home/appuser/.aws:ro
      # Montar archivos estáticos para desarrollo
      - ./static:/app/static
    environment:
      - DJANGO_SETTINGS_MODULE=rds_dashboard.settings
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 